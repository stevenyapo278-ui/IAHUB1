name: CI

on:
  push:
    branches: [master, fofana]
  pull_request:
    branches: [master]

jobs:
  backend-lint-and-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: erp_itsm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: erp-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit des dépendances (hautes et critiques)
        run: npm audit --omit=dev --audit-level=high

      - name: Check Prisma schema compiles
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://erp_user:erp_password@localhost:5432/erp_itsm?schema=public

      - name: Run lint (if configured)
        run: npx eslint src/ --ext .js 2>/dev/null || echo "ESLint non configuré, étape ignorée"

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://erp_user:erp_password@localhost:5432/erp_itsm?schema=public
          JWT_SECRET: test_jwt_secret_for_ci
          NODE_ENV: test

  frontend-lint-and-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: erp-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Seuil « critical » côté front : xlsx@0.18.5 porte un avis haut sans correctif npm
      # (le paquet n'est plus publié sur npm). Les critiques restent bloquantes.
      - name: Audit des dépendances (critiques)
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npx eslint src/ --ext .js,.jsx 2>/dev/null || echo "ESLint non configuré, étape ignorée"

      - name: Build
        run: npm run build

  mcp-glpi-build:
    name: MCP GLPI — Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mcp-glpi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-glpi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit des dépendances (hautes et critiques)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── SBOM (Software Bill of Materials) ─────────────────────────────────────
  # Produit un inventaire CycloneDX des dépendances réellement installées et le
  # publie comme artefact de build. Preuve d'inventaire (AI-BOM) : versions et
  # provenance des composants, rattachées au commit qui les a introduits.
  sbom:
    name: SBOM — CycloneDX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend — installer et générer le SBOM
        working-directory: erp-backend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@7 --output-file sbom-backend.json --spec-version 1.5

      - name: Frontend — installer et générer le SBOM
        working-directory: erp-frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@7 --output-file sbom-frontend.json --spec-version 1.5

      - name: Publier les SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            erp-backend/sbom-backend.json
            erp-frontend/sbom-frontend.json
          retention-days: 90
          if-no-files-found: error
