<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Lato:wght@400;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'TT Firs Neue';
        src: url('/fonts/tt-firs-neue/TT-FirsNeue-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'TT Firs Neue';
        src: url('/fonts/tt-firs-neue/TT-FirsNeue-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'TT Firs Neue';
        src: url('/fonts/tt-firs-neue/TT-FirsNeue-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'TT Firs Neue';
        src: url('/fonts/tt-firs-neue/TT-FirsNeue-BoldItalic.ttf') format('truetype');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
    </style>
    <title>ERP ITSM</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Boot loader — plein écran centré, remplacé au montage React. Styles inline :
          aucune dépendance au bundle CSS (affiché avant son chargement). -->
      <div id="boot-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--boot-bg,#F8FAFC);font-family:var(--user-font,Ubuntu),system-ui,sans-serif;">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg-g" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#0099ff"/><stop offset="100%" stop-color="#5856d8"/></linearGradient>
            <linearGradient id="g-m" x1="12" y1="12" x2="12" y2="56"><stop offset="0%" stop-color="#0099ff"/><stop offset="100%" stop-color="#5856d8"/></linearGradient>
            <linearGradient id="g-a" x1="32" y1="12" x2="32" y2="56"><stop offset="0%" stop-color="#5856d8"/><stop offset="100%" stop-color="#0099ff"/></linearGradient>
            <linearGradient id="g-r" x1="32" y1="12" x2="32" y2="56"><stop offset="0%" stop-color="#0099ff"/><stop offset="100%" stop-color="#5856d8"/></linearGradient>
            <linearGradient id="g-i" x1="32" y1="12" x2="32" y2="56"><stop offset="0%" stop-color="#5856d8"/><stop offset="100%" stop-color="#0099ff"/></linearGradient>
            <linearGradient id="g-e" x1="32" y1="12" x2="32" y2="56"><stop offset="0%" stop-color="#0099ff"/><stop offset="100%" stop-color="#5856d8"/></linearGradient>
            <linearGradient id="g-i2" x1="32" y1="12" x2="32" y2="56"><stop offset="0%" stop-color="#5856d8"/><stop offset="100%" stop-color="#0099ff"/></linearGradient>
            <linearGradient id="g-a2" x1="32" y1="12" x2="32" y2="56"><stop offset="0%" stop-color="#0099ff"/><stop offset="100%" stop-color="#5856d8"/></linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill="url(#bg-g)"/>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="url(#g-m)" d="M 12,56 L 12,12 L 32,36 L 52,12 L 52,56" style="animation:marie-dash 2s ease forwards;stroke-dasharray:360;stroke-dashoffset:360"/>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="url(#g-a)" d="M 12,56 L 32,12 L 52,56 M 22,40 L 42,40" style="animation:marie-dash 2s ease .3s forwards;stroke-dasharray:360;stroke-dashoffset:360"/>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="url(#g-r)" d="M 16,56 L 16,12 C 45,12 45,36 16,36 L 48,56" style="animation:marie-dash 2s ease .6s forwards;stroke-dasharray:360;stroke-dashoffset:360"/>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="url(#g-i)" d="M 32,12 L 32,56" style="animation:marie-dash 2s ease .9s forwards;stroke-dasharray:360;stroke-dashoffset:360"/>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="url(#g-e)" d="M 50,12 L 16,12 L 16,56 L 50,56 M 16,34 L 42,34" style="animation:marie-dash 2s ease 1.2s forwards;stroke-dasharray:360;stroke-dashoffset:360"/>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="url(#g-i2)" d="M 32,12 L 32,56" style="animation:marie-dash 2s ease 1.5s forwards;stroke-dasharray:360;stroke-dashoffset:360"/>
          <path stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="url(#g-a2)" d="M 12,56 L 32,12 L 52,56 M 22,40 L 42,40" style="animation:marie-dash 2s ease 1.8s forwards;stroke-dasharray:360;stroke-dashoffset:360"/>
        </svg>
        <div style="height:2px;width:160px;border-radius:9999px;background:var(--boot-track,#e2e8f0);overflow:hidden;">
          <div style="height:100%;width:33%;border-radius:9999px;background:linear-gradient(90deg,#0099ff,#5856d8);animation:bootBar 1.2s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes marie-dash { to { stroke-dashoffset: 0 } }
        @keyframes bootBar { 0% { transform:translateX(-100%) } 100% { transform:translateX(300%) } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
